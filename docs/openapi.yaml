components:
  schemas:
    ASRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
        company_code:
          type: string
          readOnly: true
        team_code:
          type: string
          title: 조
          maxLength: 8
        phone:
          type: string
          title: 요청자 전화번호
          maxLength: 20
        vehicle_number:
          type: string
          title: 차량번호
          maxLength: 32
        owner_name:
          type: string
          title: 차량 소유자
          maxLength: 32
        owner_phone:
          type: string
          title: 운영 차주 전화번호
          maxLength: 20
        reason:
          type: string
          title: A/S 사유
        admin_comment:
          type: string
          title: 관리자 코멘트
        calendar_note:
          type: string
          title: 캘린더 내용
        status:
          $ref: '#/components/schemas/ASRequestStatusEnum'
        status_display:
          type: string
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - company_code
      - created_at
      - id
      - phone
      - reason
      - status_display
      - team_code
      - updated_at
      - vehicle_number
    ASRequestStatusEnum:
      enum:
      - REPAIRING
      - OPERATING
      - REQUESTED
      - COMPLETED
      type: string
      description: |-
        * `REPAIRING` - Repairing / waiting
        * `OPERATING` - Operating
        * `REQUESTED` - A/S 요청 등록
        * `COMPLETED` - A/S 처리 완료
    AuthorTypeEnum:
      enum:
      - crew
      - admin
      type: string
      description: |-
        * `crew` - 기사
        * `admin` - 관리자
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
          nullable: true
          description: null = 전사 공통 일정 (반납 불가일 등)
        company_code:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CalendarEventKindEnum'
          title: 종류
        kind_display:
          type: string
          readOnly: true
        event_date:
          type: string
          format: date
          title: 일자
        event_time:
          type: string
          format: time
          nullable: true
          title: 시간
        title:
          type: string
          title: 제목
          maxLength: 128
        body:
          type: string
          title: 내용
        related_vehicle:
          type: integer
          nullable: true
        related_pit_record:
          type: integer
          nullable: true
        related_subscription:
          type: integer
          nullable: true
        related_return:
          type: integer
          nullable: true
        related_as:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_code
      - created_at
      - event_date
      - id
      - kind
      - kind_display
      - title
    CalendarEventKindEnum:
      enum:
      - BLOCK
      - REQ_HOPE
      - RET_HOPE
      - RET_CONFIRM
      - AS_SCHED
      - PIT_OUT
      type: string
      description: |-
        * `BLOCK` - 반납 불가
        * `REQ_HOPE` - 구독 요청 희망일
        * `RET_HOPE` - 반납 희망일
        * `RET_CONFIRM` - 반납 확정일
        * `AS_SCHED` - A/S 일정
        * `PIT_OUT` - 피트 출고 예정
    CameraCapture:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
          nullable: true
        captured_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        device:
          type: string
          maxLength: 64
        lat:
          type: number
          format: double
          nullable: true
        lon:
          type: number
          format: double
          nullable: true
        cycle_id:
          type: integer
          nullable: true
      required:
      - captured_at
    CodeEnum:
      enum:
      - YUHAN
      - CHEONHA
      - PERSONAL
      type: string
      description: |-
        * `YUHAN` - 유한
        * `CHEONHA` - 천하
        * `PERSONAL` - 개인
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          $ref: '#/components/schemas/CodeEnum'
        name:
          type: string
          maxLength: 32
        sort_order:
          type: integer
        is_active:
          type: boolean
      required:
      - code
      - id
      - name
    CompanyAppEnum:
      enum:
      - cheonha
      - abc
      type: string
      description: |-
        * `cheonha` - CHEONHA
        * `abc` - ABC
    CrewMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: 배송원코드
        name:
          type: string
          title: 배송원명
          maxLength: 100
        phone:
          type: string
          title: 전화번호
          maxLength: 20
        vehicle_number:
          type: string
          title: 차량번호
          maxLength: 20
        pay_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: 지급단가(박스당)
          description: 정규 배송원에게 지급하는 박스당 금액
        yongcha_pay_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: 용차 기본 지급단가(가구당)
          description: 기존 호환용 fallback 용차 단가
        personal_round_1_yongcha_pay_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: 1회차 개인 용차 지급단가(가구당)
          description: 개별 배송원의 1회차 용차 지급단가 override 값
        personal_round_2_yongcha_pay_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: 2회차 개인 용차 지급단가(가구당)
          description: 개별 배송원의 2회차 용차 지급단가 override 값
        personal_round_3_yongcha_pay_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          title: 3회차 개인 용차 지급단가(가구당)
          description: 개별 배송원의 3회차 용차 지급단가 override 값
        round_1_is_yongcha:
          type: boolean
          title: 1회차 용차
        round_2_is_yongcha:
          type: boolean
          title: 2회차 용차
        round_3_is_yongcha:
          type: boolean
          title: 3회차 용차
        regular_round_1_display_pay_price:
          type: string
          readOnly: true
        regular_round_2_display_pay_price:
          type: string
          readOnly: true
        regular_round_3_display_pay_price:
          type: string
          readOnly: true
        yongcha_round_1_display_pay_price:
          type: string
          readOnly: true
        yongcha_round_2_display_pay_price:
          type: string
          readOnly: true
        yongcha_round_3_display_pay_price:
          type: string
          readOnly: true
        bank_name:
          type: string
          title: 급여 은행
          maxLength: 50
        bank_account_number:
          type: string
          title: 급여 계좌번호
          maxLength: 100
        bank_account_holder:
          type: string
          title: 예금주
          maxLength: 50
        vehicle_inspection_date:
          type: string
          format: date
          nullable: true
          title: 자동차 검사일
        team:
          type: integer
          readOnly: true
          nullable: true
          title: 조
        team_name:
          type: string
          readOnly: true
          default: ''
        team_code:
          type: string
          readOnly: true
          default: ''
        partner:
          type: integer
          nullable: true
          title: 파트너사
        partner_name:
          type: string
          readOnly: true
          default: ''
        region:
          type: string
          title: 권역
          maxLength: 50
        is_active:
          type: boolean
          title: 활성화
        is_new:
          type: boolean
          title: 신규
        is_yongcha:
          type: boolean
          title: 용차 여부
        note:
          type: string
          title: 메모
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 생성일
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 수정일
      required:
      - code
      - created_at
      - id
      - name
      - partner_name
      - regular_round_1_display_pay_price
      - regular_round_2_display_pay_price
      - regular_round_3_display_pay_price
      - team
      - team_code
      - team_name
      - updated_at
      - yongcha_round_1_display_pay_price
      - yongcha_round_2_display_pay_price
      - yongcha_round_3_display_pay_price
    CustomTokenObtainPair:
      type: object
